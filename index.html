ody{font-size:21px;line-height:1.62;white-space:pre-wrap}.signoff{text-align:center;margin-top:45px;font-size:26px;font-style:italic}.stamp{display:inline-block;border:1px solid var(--rose);color:var(--rose);padding:7px 11px;transform:rotate(-2deg);font:10px "DM Mono",monospace;letter-spacing:.15em}@media(max-width:600px){.inner{padding:58px 30px}.letter{padding:48px 24px}.letter-body{font-size:19px}}

const LETTER = "Roses are red\nViolets are blue\nSomeone’s old\nBut it’s not me\nIt’s you. 😂\n\nHappy 30th birthday, Tevin.\n\nI don’t know how we got here.\n\nSomewhere between Twitter, a random meeting at Rituals because I was having a terrible day at work, and all the years that followed, you somehow became one of those people who found a permanent place in my life.\n\nI was 19 when we first started talking. You were 23. And now you’re 30.\n\nWhich is honestly quite crazy 😂\n\nBut jokes aside, I feel incredibly grateful that I got to know you when I did, and that I’ve had the privilege of knowing you through so many different versions of yourself. (And myself)\n\nI’ve watched you grow. I’ve watched you change. I’ve watched you go through things that could have made you stop, and somehow you kept moving. I’ve watched you become more intentional about the person you want to be and the life you want to live.\n\nYou talk about my growth sometimes, and I don’t know if I’ve ever told you this properly, but I admire yours too.\n\nI’m proud of the man you’ve become.\n\nI admire how hard you work for the things you want. I admire the way you protect your peace and how much you’ve come to understand the importance of doing that. I admire how generous you are with your time, how you listen, and how you show up for the people you care about.\n\nYou’ve shown up for me in ways that no one else has before.\n\nAnd I hope you know that those things don’t go unnoticed.\n\nOf course, I also have to acknowledge the other side of you, the SMART MOUTH, the ridiculous comebacks, and the fact that apparently every conversation is an opportunity for you to say something smart enough to annoy me. 😂 Our banter has probably done more for my character development than some motivational speeches ever could.\n\nBut underneath all of that, there are moments with you that I know I’ll carry for a very long time.\n\nOne of them will always be that airport surprise in Canada. Had my knee not been compromised everyone in that airport would’ve known just how happy I was.\n\nAnd then there’s the Briana anklet.\n\nI’ve thought about that gift many times over the years. My middle name is Briana, but before I ever became part of your life, there was another Briana who meant the world to you. I know how special that friendship was to you, and I know that losing her left a space that could never simply be replaced.\n\nSo when you gave me that anklet in 2021, knowing the meaning behind that name, it felt like so much more than a piece of jewelry.\n\nI thought about her.\n\nI thought about what she meant to you and the memories you carry of her. And, perhaps selfishly, I also wondered about what it meant that you chose to give something with that name to me.\n\nI don’t think I’ll ever fully know what that moment meant from your side, but I know what it meant to me.\n\nIt reminded me that people can leave marks on our lives in ways they never could have predicted. Sometimes they become memories. Sometimes they become lessons. Sometimes, somehow, they become part of the stories we continue writing.\n\nAnd you’ve been part of mine for a very long time.\n\nThat’s something I don’t take lightly.\n\nYou’ve been important to me from the moment I first laid eyes on you. And while our story has never been the simplest one to explain, I don’t think everything meaningful has to be simple to be real.\n\nThere have been so many versions of us, so many conversations, so many laughs, disagreements, memories, changes, and chapters. And somehow, through all of them, you’ve remained someone who I genuinely care about.\n\nI want 30 to be good to you.\n\nNot just good in the obvious ways, but good in the ways that matter when nobody else is looking.\n\nI want you to experience everything your heart desires. I want you to accomplish every dream you’ve ever allowed yourself to imagine, every dream you’ve quietly carried with you. I want you to build a life that makes you proud to wake up in it, a life that is genuinely yours.\n\nI hope you find the peace you’ve been longing for and that you never feel guilty for choosing it.\n\nI hope you continue to become more of yourself, not less, simply because the world sometimes asks people to be easier to understand. I hope you continue to be genuine to yourself. I hope you keep growing without ever losing the parts of you that make you you. I hope you have people around you who appreciate you, challenge you, support you, and remind you of who you are when you forget. (I promise to always be one of them, for as long as you’ll have me)\n\nI hope you remain genuine.\n\nI hope you laugh until your stomach hurts. I hope you travel, take risks, make memories, make mistakes, learn, grow, and experience the kind of happiness that doesn’t need to be explained.\n\nAnd I hope, somewhere along the way, you look around at the life you’ve built and realize just how far you’ve come.\n\nBecause I see it.\n\nI’ve seen the boy who was 23 become the man who is 30.\n\nAnd I am proud of him.\n\nSo here’s to 30.\n\nTo everything you’ve survived.\n\nEverything you’ve learned.\n\nEverything you’ve become.\n\nEverything you’re still becoming.\n\nAnd all the things you haven’t even dreamed of yet.\n\nThank you for being you. Thank you for the ways you’ve shown up for me. Thank you for the memories, the laughs, the arguments, the ridiculous comebacks, the unexpected moments, and the pieces of yourself you’ve trusted me enough to share.\n\nI don’t know what every future chapter will look like, and maybe that’s the beauty of it.\n\nBut I know that when I look back at my life, I’ll always be grateful that somewhere along the way, a 19-year-old having a terrible day at work met a 23-year-old who asked her to meet him at Rituals.\n\nAnd that meeting became you.\n\nHappy 30th birthday, Tevin.\n\nI hope this decade gives you everything you’ve been working, hoping, and waiting for.\n\nAnd yes, you’re officially old now.\n\nPlease act accordingly. 😂❤️ \n\nIt goes without saying, but , I love you.";
const PASSWORD = "rituals";

function unlock() {
  const pw = document.getElementById("pw").value.trim().toLowerCase();
  const error = document.getElementById("error");
  error.textContent = "";
  if (pw !== PASSWORD) {
    error.textContent = "That password doesn't open this little secret. Try again. ♡";
    return;
  }
  document.getElementById("letterText").textContent = LETTER;
  document.getElementById("gate").style.display = "none";
  document.getElementById("letter").style.display = "block";
  window.scrollTo({top:0, behavior:"smooth"});
}

document.getElementById("unlock").addEventListener("click", unlock);
document.getElementById("pw").addEventListener("keydown", e => {
  if (e.key === "Enter") unlock();
});
</script></body></html>
